name: Android CI Build Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Run JVM Unit & Robolectric Tests
      run: ./gradlew test

    - name: Build Android Debug APK
      run: ./gradlew :app:assembleDebug

    - name: Verify Debug APK Output
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/debug/app-debug.apk artifacts/NearbyChat-debug.apk
        echo "Debug APK successfully verified and copied to artifacts/NearbyChat-debug.apk."

    - name: Build Release APK (Conditional on Secrets)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          
          echo "Building signed Release APK..."
          export STORE_PASSWORD="$STORE_PASSWORD"
          export KEY_ALIAS="$KEY_ALIAS"
          export KEY_PASSWORD="$KEY_PASSWORD"
          export KEYSTORE_PATH="my-upload-key.jks"
          
          ./gradlew :app:assembleRelease
          
          cp app/build/outputs/apk/release/app-release.apk artifacts/NearbyChat-release.apk
          echo "Release APK successfully generated and copied to artifacts/NearbyChat-release.apk."
        else
          echo "No signing secrets found. Skipping Release APK build..."
        fi

    - name: Upload Build Artifacts (NearbyChat APKs)
      uses: actions/upload-artifact@v4
      with:
        name: NearbyChat-APKs
        path: |
          artifacts/NearbyChat-debug.apk
          artifacts/NearbyChat-release.apk
        if-no-files-found: warn
        retention-days: 14
