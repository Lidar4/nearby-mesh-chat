name: Android Release Build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Validate and Publish Release APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare CI signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p app
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks
            test -s app/my-upload-key.jks
            echo "Using repository release keystore."
          else
            echo "No release keystore secret configured; generating an ephemeral CI-only signing key."
            keytool -genkeypair -v \
              -keystore app/my-upload-key.jks \
              -alias "${KEY_ALIAS:-upload}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-${STORE_PASSWORD:-temppass}}" \
              -keypass "${KEY_PASSWORD:-temppass}" \
              -dname "CN=Nearby Chat CI, OU=Build, O=Nearby Chat, C=US"
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: my-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'temppass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'temppass' }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Validate APK and AAB
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          mkdir -p artifacts
          cp "$apk" artifacts/NearbyChat-release.apk
          cp "$aab" artifacts/NearbyChat-release.aab
          sha256sum artifacts/NearbyChat-release.apk artifacts/NearbyChat-release.aab | tee artifacts/checksums.txt
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose artifacts/NearbyChat-release.apk
          fi
          cat > artifacts/build-info.json <<EOF
          {
            "appName": "Nearby Chat",
            "packageName": "com.aistudio.nearbychat.uwyqxt",
            "versionName": "1.0.0",
            "versionCode": 1,
            "gitCommit": "${{ github.sha }}",
            "buildType": "release"
          }
          EOF

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NearbyChat-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}"
          title="Nearby Chat APK Build ${{ github.run_number }}"

          gh release create "$tag" \
            artifacts/NearbyChat-release.apk \
            artifacts/NearbyChat-release.aab \
            artifacts/checksums.txt \
            artifacts/build-info.json \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --notes "Automated Nearby Chat release from commit ${{ github.sha }}."

          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$tag"
